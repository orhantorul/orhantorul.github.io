<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- OT monogram, "Horizon" (D2·R1). Inverts in dark browser themes so the ring stays visible. Master: _logo/ot-logo.svg -->
  <style>
    .i{fill:#111}.is{stroke:#111}.p{fill:#fff}.ps{stroke:#fff}
    @media (prefers-color-scheme: dark){.i{fill:#fff}.is{stroke:#fff}.p{fill:#111}.ps{stroke:#111}}
  </style>
  <defs><clipPath id="top"><rect width="200" height="100"/></clipPath></defs>
  <circle class="p" cx="100" cy="100" r="94"/>
  <circle class="is" cx="62" cy="100" r="25.75" fill="none" stroke-width="14.5"/>
  <rect class="i" x="107" y="68" width="64" height="14"/>
  <rect class="i" x="132" y="68" width="14" height="64"/>
  <g clip-path="url(#top)">
    <circle class="i" cx="100" cy="100" r="94"/>
    <circle class="ps" cx="62" cy="100" r="25.75" fill="none" stroke-width="14.5"/>
    <rect class="p" x="107" y="68" width="64" height="14"/>
    <rect class="p" x="132" y="68" width="14" height="64"/>
  </g>
  <circle class="is" cx="100" cy="100" r="93" fill="none" stroke-width="6"/>
</svg>
