<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>OT</title>
  <!-- OT monogram, "Horizon" (D2·R1), Nov 2026. Black top / white bottom; letters invert across the middle. -->
  <defs><clipPath id="top"><rect width="200" height="100"/></clipPath></defs>
  <circle cx="100" cy="100" r="94" fill="#fff"/>
  <g fill="#111">
    <circle cx="62" cy="100" r="25.75" fill="none" stroke="#111" stroke-width="14.5"/>
    <rect x="107" y="68" width="64" height="14"/>
    <rect x="132" y="68" width="14" height="64"/>
  </g>
  <g clip-path="url(#top)" fill="#fff">
    <circle cx="100" cy="100" r="94" fill="#111"/>
    <circle cx="62" cy="100" r="25.75" fill="none" stroke="#fff" stroke-width="14.5"/>
    <rect x="107" y="68" width="64" height="14"/>
    <rect x="132" y="68" width="14" height="64"/>
  </g>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#111" stroke-width="6"/>
</svg>
